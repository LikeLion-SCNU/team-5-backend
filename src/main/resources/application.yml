server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  scheduling:
    morning-statement-cron: "0 0 8 * * *"
  upload:
    max-input-size: 10MB
    max-generated-size: 20MB
  timezone:
    default-zone: Asia/Seoul
  cors:
    allow-credentials: true
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    exposed-headers:
      - Location
