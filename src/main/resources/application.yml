server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_INPUT_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:11MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

kakao:
  token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
  user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}

app:
  jwt:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  auth:
    rate-limit:
      capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}
      window: ${AUTH_RATE_LIMIT_WINDOW:1m}
      max-buckets: ${AUTH_RATE_LIMIT_MAX_BUCKETS:10000}
  scheduling:
    morning-statement-cron: "0 0 8 * * *"
  upload:
    max-input-size: ${UPLOAD_MAX_INPUT_SIZE:10MB}
    max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:11MB}
    max-generated-size: ${UPLOAD_MAX_GENERATED_SIZE:20MB}
  timezone:
    default-zone: Asia/Seoul
  cors:
    allow-credentials: true
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - If-None-Match
    exposed-headers:
      - Location
      - ETag
