spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:54320/naeil_bank_test
    username: naeil
    password: naeil_test
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: test-jwt-secret-fixture-32-bytes-minimum
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  auth:
    rate-limit:
      capacity: 5
      window: 1m
      max-buckets: 100
  cors:
    allow-credentials: true
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - If-None-Match
    exposed-headers:
      - Location
      - ETag
  scheduling:
    morning-statement-cron: "0 0 8 * * *"
  upload:
    max-input-size: 10MB
    max-generated-size: 20MB
  timezone:
    default-zone: Asia/Seoul

kakao:
  client-id: test
  redirect-uri: http://localhost/test
  client-secret: test

openai:
  api-key: test-openai-api-key-fixture
  meal-model: gpt-5-mini
  image-model: gpt-image-2
  timeout: 30s

web-push:
  encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  vapid:
    public-key: test-vapid-public-key-fixture
    private-key: test-vapid-private-key-fixture
    subject: mailto:test@example.com
