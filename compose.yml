services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_NAME: ${DB_NAME:-naeil_bank}
      DATABASE_URL: postgresql://naeil:${POSTGRES_PASSWORD}@naeil-db:5432/${DB_NAME:-naeil_bank}
    networks: [default, dbnet]
networks:
  dbnet:
    external: true
    name: app_default
